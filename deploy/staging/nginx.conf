server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    location = / {
        return 302 /zehit/;
    }

    location = /zehit {
        return 308 /zehit/;
    }

    location /zehit/ {
        try_files $uri $uri/ /zehit/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/zehit/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

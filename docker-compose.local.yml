services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"
    volumes: !override
      - zerith_local_postgres:/var/lib/postgresql/data

  api:
    ports: !override
      - "127.0.0.1:8091:8081"
    environment:
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      ZERITH_DEMO_DATASET_ENABLED: "true"

volumes:
  zerith_local_postgres:

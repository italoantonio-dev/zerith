services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zerith
      POSTGRES_USER: zerith
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - zerith_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerith -d zerith"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zerith
      DB_USER: zerith
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      ZERITH_SEED_ENABLED: "true"
      ZERITH_DEMO_PASSWORD: ${ZERITH_DEMO_PASSWORD}
      ZERITH_DEVICE_KEY: ${ZERITH_DEVICE_KEY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zerith_postgres:
